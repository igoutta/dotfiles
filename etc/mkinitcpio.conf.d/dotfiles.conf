# /etc/mkinitcpio.conf.d/dotfiles.conf — drop-in que sustituye HOOKS sin tocar el
# mkinitcpio.conf de Arch. Después: sudo mkinitcpio -P.
# Único cambio frente al de la guía: `grub-btrfs-overlayfs` al final, para arrancar desde GRUB
# una instantánea de solo lectura con una capa escribible en RAM. `resume` y `btrfs` se quedan
# como están hasta decidir la hibernación (TODO.md). Fedora/Ubuntu usan dracut:
# rd.live.overlay.overlayfs=1.
HOOKS=(base udev resume btrfs autodetect microcode modconf kms keyboard keymap consolefont block encrypt filesystems fsck grub-btrfs-overlayfs)
