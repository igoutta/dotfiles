# /etc/mkinitcpio.conf.d/dotfiles.conf — drop-in que sustituye HOOKS sin tocar el
# mkinitcpio.conf de Arch. Después: sudo mkinitcpio -P.
# Un solo HOOKS para las dos disposiciones: en la reinstalación (LVM dentro del LUKS) todos
# hacen algo; en la instalación de 2026-08, `lvm2` no encuentra volúmenes y `resume` no tiene
# resume=, y los dos siguen de largo. Fuera `btrfs` (solo para Btrfs en varios discos) y fuera
# `kms`: metería nouveau en el initramfs junto al driver NVIDIA; la consola temprana la da
# `i915` desde MODULES. `grub-btrfs-overlayfs` al final: arrancar desde GRUB una instantánea de
# solo lectura con una capa escribible en RAM. Fedora/Ubuntu usan dracut.
HOOKS=(base udev autodetect microcode modconf keyboard keymap consolefont block encrypt lvm2 resume filesystems fsck grub-btrfs-overlayfs)
