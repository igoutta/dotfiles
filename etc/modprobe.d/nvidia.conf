# /etc/modprobe.d/nvidia.conf — opciones del driver NVIDIA (nvidia-open, módulos abiertos, los
# que NVIDIA recomienda de Turing en adelante). El hook modconf las copia al initramfs.
# Ubuntu/Fedora: mismo archivo y ruta.

# KMS y consola en el DRM de NVIDIA: lo exigen los compositores Wayland para usar sus salidas,
# aquí el USB-C del tercer monitor. Desde el driver 560 es el valor por defecto; explícito.
options nvidia-drm modeset=1 fbdev=1

# Apagar la GPU dedicada cuando nadie la usa (portátil híbrido, Ampere): 0x02 = control fino.
# Con un monitor en el USB-C se queda encendida, que es lo esperable.
options nvidia NVreg_DynamicPowerManagement=0x02

# Conservar la memoria de vídeo al suspender; sin esto las apps que usaban la GPU despiertan
# corruptas. Va con nvidia-suspend.service y nvidia-resume.service. El volcado va a /var/tmp
# porque /tmp es RAM.
options nvidia NVreg_PreserveVideoMemoryAllocations=1 NVreg_TemporaryFilePath=/var/tmp
