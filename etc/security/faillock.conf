# /etc/security/faillock.conf — bloqueo de cuenta por contraseñas fallidas (pam_faillock),
# que aplica a sudo, al greeter y a la pantalla de bloqueo. De fábrica: 3 fallos en 15 min
# bloquean 10 min. Elegido el 2026-09-25: cinco fallos (a juego con passwd_tries=5 de sudo) y
# dos minutos de bloqueo. Lo no listado conserva el valor por defecto. Ubuntu/Fedora: mismo
# archivo y sintaxis.
deny = 5
unlock_time = 120
