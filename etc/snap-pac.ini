# /etc/snap-pac.ini — instantáneas de pacman con snapper (hooks de snap-pac). Solo la config
# root se instantánea (por defecto); home no tiene nada que ver con pacman. Los paquetes de
# abajo marcan el par pre/post como importante: snapper conserva 5 de esos aparte de los 20
# normales (etc/snapper/configs/root). Fedora/Ubuntu: no existe snap-pac; ver docs/snapper.md.
[root]
important_packages = ["linux", "linux-headers", "linux-firmware", "intel-ucode", "systemd", "grub", "grub-btrfs", "mkinitcpio", "cryptsetup", "btrfs-progs", "mesa", "nvidia-open-dkms"]
