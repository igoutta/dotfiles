# /etc/tmpfiles.d/charge-limit.conf — límite de carga de la batería al 80 % en cada arranque.
# El driver asus-wmi del kernel expone el límite; sin esto vuelve a 100 % al reiniciar. No hace
# falta asusctl. Ubuntu/Fedora: mismo archivo y ruta (systemd-tmpfiles). Aplicar sin reiniciar:
# sudo systemd-tmpfiles --create charge-limit.conf
w /sys/class/power_supply/BAT1/charge_control_end_threshold - - - - 80
