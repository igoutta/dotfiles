# ~/.config/gtk-3.0/settings.ini — apps GTK3 bajo niri.
# Tema adw-gtk3: GTK3 con el aspecto de libadwaita, y el único que la plantilla gtk3 de
# noctalia colorea bien (Arch: pacman -S adw-gtk-theme; Fedora: dnf install adw-gtk3-theme;
# Ubuntu: paquete adw-gtk3 desde GitHub/lassekongo83). Sin él, GTK cae en Adwaita.
# Cursor e iconos Adwaita, los mismos que declara niri (startup.kdl) para no mezclar.
# Los colores los pone noctalia vía gtk.css; los portales GNOME leen gsettings, no este
# archivo: ver los `gsettings set` de INSTALL.md.
[Settings]
gtk-theme-name=adw-gtk3-dark
gtk-application-prefer-dark-theme=true
gtk-icon-theme-name=Adwaita
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24
gtk-font-name=Noto Sans 10
# Sin decoraciones del cliente en niri (prefer-no-csd); si alguna app las dibuja, solo cerrar.
gtk-decoration-layout=:close
gtk-enable-animations=true
