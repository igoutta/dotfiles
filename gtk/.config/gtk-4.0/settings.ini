# ~/.config/gtk-4.0/settings.ini — apps GTK4/libadwaita bajo niri.
# libadwaita ignora gtk-theme-name; los colores llegan por gtk.css (plantilla gtk4 de
# noctalia). Cursor e iconos Adwaita, como en niri y gtk-3.0.
[Settings]
gtk-application-prefer-dark-theme=true
gtk-icon-theme-name=Adwaita
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24
gtk-font-name=Noto Sans 10
# Sin botones de ventana en las barras de título (niri no los usa: se cierra con Mod+Q). En
# Wayland manda gsettings org.gnome.desktop.wm.preferences button-layout, que INSTALL.md
# fija igual; esto queda de respaldo.
gtk-decoration-layout=:
gtk-enable-animations=true
