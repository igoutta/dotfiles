# ~/.config/environment.d/50-mise.conf — PATH para la sesión gráfica (systemd --user y, por
# niri-session, todo lo que lance niri). Sin esto solo las shells con `mise activate` ven
# node y pnpm; con esto los ven VS Code, Claude Code lanzado desde él, etc. Aplica al volver
# a entrar. Mismo archivo en Ubuntu/Fedora (systemd).
PATH=$HOME/.local/share/mise/shims:$PATH
