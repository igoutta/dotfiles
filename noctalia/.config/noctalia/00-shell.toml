# ~/.config/noctalia/00-shell.toml — barra, dock, sonido, brillo, calendario, bloqueo.
# Noctalia 5 lee todos los *.toml de este directorio (capa declarativa, recarga en caliente)
# y encima aplica ~/.local/state/noctalia/settings.toml, que escribe su GUI. Lo que se
# quiera conservar va aquí; el settings.toml es desechable (ver README.md).
# Arch: pacman -S noctalia. Fedora/Ubuntu: sin paquete oficial; releases de GitHub.

[shell]
# Fuente de la barra con iconos (misma familia que la terminal).
font_family = "FiraCode Nerd Font Ret"
lang = "en"
# Iconos de app teñidos con la paleta; ventana de ajustes translúcida.
app_icon_colorize = true
settings_window_translucent = true
# En la vista general de niri, escribir lanza el buscador de apps.
niri_overview_type_to_launch_enabled = true
password_style = "random"
external_ip_enabled = true
screen_time_enabled = true
telemetry_enabled = true

# Cada cambio de fondo, paleta, modo o fuente se pasa al greeter sin preguntar: la regla
# de polkit de `noctalia-greeter passwordless-sync enable ga` (INSTALL.md) lo autoriza.
[shell.greeter_sync]
auto_sync = true

[shell.launcher]
app_grid = true

[shell.screenshot]
confirm_region = true
remember_last_region = true

# Barra: izquierda lanzador, fondo de vídeo, fondo y workspaces; derecha estado y sesión.
# Sin el widget "bar" del plugin niri-displays, que ya no se usa (outputs en niri).
[bar.default]
start = [ "launcher", "mpvpaper", "wallpaper", "workspaces" ]
# temp es el widget nativo sysmon (cpu_temp); pulse (CPU y RAM) y claude son de plugins,
# definidos en 30-plugins.toml. Sin bluetooth ni brillo (2026-09-25, la derecha iba
# saturada): los dos están en el centro de control, y el brillo en Fn+F7/F8. Sin el búho
# (widget control-center): el clic derecho en cualquier hueco de la barra ya abre el centro
# de control, y Mod+S también.
end = [
    "media",
    "power_profile",
    "usb",
    "temp",
    "pulse",
    "claude",
    "tray",
    "notifications",
    "clipboard",
    "network",
    "volume",
    "battery",
    "session",
]

# El HDMI va en vertical y mide 768 de ancho: la barra completa no cabe. Ahí solo
# workspaces, reloj y notificaciones. match es el conector de niri. Márgenes en 15-style.toml.
[bar.default.monitor.hdmi]
match = "HDMI-A-1"
start = [ "workspaces" ]
center = [ "clock" ]
end = [ "notifications" ]

# Menos texto en la derecha: solo iconos en red y volumen (el SSID y el porcentaje están en
# el centro de control y en el OSD), multimedia oculto si no suena nada (quitaba «Nothing
# Playing»), la bandeja en un solo botón que abre sus iconos, y de Claude solo la ventana
# de 5 horas. La batería conserva su porcentaje.
[widget.media]
hide_when_no_media = true

[widget.network]
show_label = false

[widget.volume]
show_label = false

[widget.tray]
drawer = true

[widget.claude]
usage_percent_display = "session"

# Clic derecho en la batería: la gráfica del plugin battery-graph (30-plugins.toml).
[widget.battery.actions]
right = "panel-toggle frai3mega/battery-graph:battery-panel"

[dock]
enabled = true
reserve_space = false
show_dots = true
smart_auto_hide = true

[audio]
enable_overdrive = true
enable_sounds = true

# Brillo del monitor externo por DDC/CI (ddcutil). Requiere estar en el grupo i2c: TODO.md.
[brightness]
enable_ddcutil = true

[battery]
warning_threshold = 20

[calendar]

[control_center.calendar]
show_week_numbers = true

[location]
auto_locate = true

[nightlight]
enabled = true

# Pantalla de bloqueo: fondo desenfocado. La posición de los widgets se edita con el ratón
# y vive en settings.toml ([lockscreen_widgets]); no se declara aquí.
[lockscreen]
blurred_desktop = true
