; ~/.config/qt6ct/qt6ct.conf — aspecto de las apps Qt6 (PDF4QT, PhotoQt, NAPS2 no: es GTK3).
; Lo lee el plugin qt6ct porque niri exporta QT_QPA_PLATFORMTHEME=qt6ct (startup.kdl).
; Paleta: la plantilla «qt» de noctalia (10-theme.toml) escribe colors/noctalia.conf fuera del
; repo; esta línea color_scheme_path es su enganche. Estilo Fusion: el que respeta la paleta.
; No guardar desde la ventana de qt6ct: reescribe el archivo y rompe el enlace de stow.
; Ruta absoluta: qt6ct no expande ~. Ubuntu/Fedora: paquete qt6ct en apt y dnf; igual.

[Appearance]
color_scheme_path=/home/ga/.config/qt6ct/colors/noctalia.conf
custom_palette=true
icon_theme=Adwaita
standard_dialogs=default
style=Fusion
